databases:
  - name: pulseline-clinic-db
    plan: free
    databaseName: pulseline_clinic
    user: pulseline

services:
  # --- Backend: Express + Prisma + Socket.IO ---
  - type: web
    name: pulseline-clinic-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseline-clinic-db
          property: connectionString
      # Set this to your actual frontend URL after the static site is created
      # (Render assigns its URL on first deploy, so this may need one manual
      # edit the first time). Comma-separate multiple origins if needed.
      - key: CLIENT_URL
        value: https://pulseline-clinic-frontend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Fill these in manually from your Cloudinary dashboard after deploy —
      # secrets aren't auto-generated for third-party services.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # --- Frontend: Vite static build ---
  - type: web
    name: pulseline-clinic-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_USE_MOCK_API
        value: "false"
      # Update after the backend's first deploy assigns its real URL.
      - key: VITE_API_BASE_URL
        value: https://pulseline-clinic-backend.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: Pulseline Clinic
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
